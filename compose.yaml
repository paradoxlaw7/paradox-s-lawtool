services:
  app:
    build: .
    restart: unless-stopped
    environment:
      HARNESS_ACCESS_TOKEN: ${HARNESS_ACCESS_TOKEN:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      AI_MODEL: ${AI_MODEL:-deepseek-ai/DeepSeek-V3.2}
      AI_RESPONSE_FORMAT: ${AI_RESPONSE_FORMAT:-auto}
      AI_STREAM: ${AI_STREAM:-true}
      APP_PASSWORD: ${APP_PASSWORD:?Set a random access password}
      PUBLIC_ORIGIN: https://${DOMAIN:?Set your domain}
    volumes:
      - workspace_data:/app/data
    expose:
      - "8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 10s
  web:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  workspace_data:
  caddy_data:
  caddy_config:
